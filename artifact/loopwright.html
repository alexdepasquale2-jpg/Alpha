<title>Loopwright</title>
<!--
  Loopwright as a claude.ai artifact. The artifact host wraps this file in its
  own <html>/<head>/<body>, and the rest of the app (web/css, web/js, icons) is
  published alongside it with web/ as the root. data-host="artifact" tells the
  app it's in the artifact frame (see web/js/core/host.js).
-->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<div id="app" data-host="artifact" aria-busy="true"></div>
<div id="print-root"></div>
<noscript><p style="padding:24px;font-family:system-ui">Loopwright needs JavaScript to run.</p></noscript>
<script type="module" src="js/main.js"></script>
